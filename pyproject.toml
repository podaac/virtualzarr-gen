[project]
name = "virtualizarr-gen"
version = "0.4.0a8"
description = "Generate and maintain Icechunk virtual Zarr stores for Earthdata collections."
authors = [{ name = "podaac-tva", email = "podaac-tva@jpl.nasa.gov" }]
requires-python = ">=3.12,<3.13"

dependencies = [
    "virtualizarr==2.8.0",
    "zarr==3.4.2",
    "xarray==2026.9.0",
    "obstore==0.12.1",
    "dask[complete]==2026.8.0",
    "fsspec==2026.9.0",
    "icechunk==2.3.1",
    "earthaccess==0.19.0",
    "h5py==3.16.0",
    "boto3",
]

[project.scripts]
generate-vds-icechunk = "podaac.generate_vds_icechunk:cli"

[tool.poetry]
packages = [
    { include = "podaac" },
    { include = "icechunk_pipeline" },
]

[tool.poetry.group.dev.dependencies]
pytest = "*"
flake8 = "^7.0.0"
pylint = "^4.0.3"

# Runtime for the append Lambda container image (Dockerfile `lambda` target).
[tool.poetry.group.lambda]
optional = true

[tool.poetry.group.lambda.dependencies]
awslambdaric = "*"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
