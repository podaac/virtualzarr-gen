[project]
name = "virtualizarr-gen"
version = "0.4.0a8"
description = "Generate and maintain Icechunk virtual Zarr stores for Earthdata collections."
authors = [{ name = "podaac-tva", email = "podaac-tva@jpl.nasa.gov" }]
requires-python = ">=3.12,<3.13"

dependencies = [
    "virtualizarr==2.7.3",
    "zarr==3.2.1",
    "xarray==2026.7.0",
    "obstore==0.9.5",
    "dask[complete]==2024.5.2",
    "fsspec==2026.3.0",
    "icechunk==2.2.0",
    "earthaccess==0.18.0",
    "h5py==3.16.0",
    "boto3",
]

[project.scripts]
generate-vds-icechunk = "podaac.generate_vds_icechunk:cli"

[dependency-groups]
dev = [
    "pytest",
    "flake8>=7.0.0",
    "pylint>=4.0.3",
]
# Runtime for the append Lambda container image (Dockerfile `lambda` target).
lambda = [
    "awslambdaric",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podaac", "icechunk_pipeline"]
